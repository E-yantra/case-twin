# -------------------------------------------------------
# CaseTwin — local deployment
#
#   docker compose up --build
#
#   Backend API  → http://localhost:8005
#   Frontend UI  → http://localhost:8080
#
# Backend secrets come from backend/.env (gitignored) via
# env_file — they are never baked into the image.
# The frontend image is built with VITE_API_URL=/api (Dockerfile
# build arg). Nginx proxies that same-origin path to the backend
# service, so remote browsers never call their own localhost.
# -------------------------------------------------------

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: backend/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATASET_DIR: /app/dataset
    volumes:
      - ./dataset:/app/dataset:ro
    depends_on:
      - qdrant
    ports:
      - "8005:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        VITE_OPENWEBUI_URL: ${VITE_OPENWEBUI_URL:-}
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  qdrant_storage:
